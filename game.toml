# games/populous/game.toml - everything the kit needs to know about this game
# that is not derivable from the binary. Addresses are guest addresses in the
# pinned executable. Hooks are added as literals leave the kit's code.

[game]
id = "populous"
name = "Populous: The Beginning"
app_name = "PopRecomp"
bundle_id = "dev.recompkit.populous"
executable = "D3DPopTB.exe"
sha256 = "815ba8a550f571c38b602cf3386f65aab942667a4a2d9c7096b3660deac2eacd"
image_base = 0x00400000
entry_point = 0x0055d6c0
guest_root = 'C:\Populous'
# Where a developer checkout finds the game, relative to the repository root.
developer_exe = "original/gog/D3DPopTB.exe"

[translate]
# Ghidra listing directory holding functions.tsv and functions/*.asm,
# relative to the repository root.
listings = "analysis/decompiled/D3DPopTB.exe"
# Curated symbols, relative to this directory.
globals = "globals.toml"
# The guest global whose reads select a visual phase (sprite_animation_counter).
animation_counter = 0x00897981
# Reads of animation_counter that only pick a visual phase or blink. Do NOT
# include interpolation, simulation stamps, FPS measurement or input timing.
volatile_reads = [
  0x468f27, 0x4690ad, 0x46922b, 0x469327,  # spell/particle textures
  0x4758b0, 0x4758c4, 0x4758d4,            # selection pulse
  0x525c05, 0x525c15,                      # rectangle pulse
  0x49d2eb, 0x49d386, 0x49d890, 0x4a2581,  # UI blinking
  0x47a76d, 0x47a8f5,                      # palette animation
  0x50f45c,                                # effect sprite phase
]

[hooks]
# runtime/kernel32.cpp native_frame_clock: the two draw-loop waits in the
# pinned executable, identified by the return address of their GetTickCount.
frame_clock_begin = 0x004a45a3          # before the 1000 / DrawFrameRateLimit read
frame_clock_wait = 0x004a47c1           # the wait that only retires the deadline
frame_clock_wait_clamp = 0x004a47a4     # the wait whose successor clamps the rate into EDI
frame_clock_clamp_deadline = 0x0098e7cc # deadline value returned after the clamping wait
frame_clock_wait_deadline = 0x0098e7e0  # deadline value returned after the plain wait
# dx/ddraw.cpp: globals holding the two 32x32 mouse-pointer surface interfaces
cursor_surface_ptrs = [0x005d5718, 0x005d571c]
# host/input_gate.cpp: the game's mouse device object and its vtable
mouse_vtable = 0x00591b6c
mouse_device_ptr = 0x00d0595c
mouse_device_right = 0x00d0599c
# host/smoke_main.cpp: the camera record the smoke script inspects
camera = 0x0074a350

[settings]
# The F10 page and the native Options tabs show these rows. UI scale is left
# out: Populous scales its sidebar with the world, so the row only resized the
# pointer. "controls" is the one entry covering the on-screen control rows
# (it was spelled "keypad" before the kit's touch controls landed).
rows = ["rendering", "wide_view", "window", "resolution", "frame_limit",
        "performance_overlay", "textures", "filtering", "controls"]

[controls]
# Populous is played with the mouse: the pointer commands followers, casts
# papal magic and clicks the sidebar, so the pad is "mapped" onto keys and
# mouse. The game reads no joystick - nothing in the listings touches
# DirectInput's joystick interfaces - so "native" would feed a device it
# never polls.
#
# default_layout is the pad ALONE, not "pad+keys", which is the kit's usual
# choice. The game's entire interface is one full-height strip down the LEFT
# edge of the image, about 16% of its width: the round minimap at the top,
# the Buildings/Spells/Followers panel tabs under it, then the spell and
# follower grid, and the current-spell slot at the bottom (see the composite
# dumps under build/gameplay). The kit's tablet "pad+keys" puts a 268pt
# keyboard half in each bottom corner (eight 30pt columns and their gaps),
# so its left half buries that strip from the panel tabs down - exactly the
# controls a Populous player clicks every few seconds. The shipped
# layouts/pad.tablet.json keeps the pad itself clear of the strip, and the
# layout's own KEYS tab is one tap away when a key is wanted, so nothing is
# lost.
default_layout = "pad"
pad = "mapped"

[controls.mapped]
# Every binding here is a key off the game's own Keycard (the "Quick
# Reference Card.pdf" that ships with the GOG release), preferred over a
# generic one.
#
# The pointer goes on the LEFT stick, the reverse of the kit default,
# because the face diamond is in the bottom-right corner: aiming and
# clicking at the same time needs the two thumbs on opposite sides.
left_stick = "cursor"
# The Keycard's camera keys: UP/DOWN scroll forwards and backwards,
# LEFT/RIGHT rotate. "arrows" holds them while the stick is deflected,
# which is what a held cursor key does in the game.
right_stick = "arrows"
# The same four keys for a physical controller's dpad. The on-screen pad in
# layouts/pad.tablet.json has no dpad - it would only duplicate the right
# stick and there is no room for it beside the sidebar - but a real pad has
# one in hardware, so the binding is worth keeping.
dpad = "arrows"
cursor_speed = 900
# Left click: select a follower, order it, cast the selected spell. The one
# gesture the game cannot be played without.
cross = "mouse_left"
# Right click on an object is the Keycard's Query, and on a spell icon it
# toggles that spell.
circle = "mouse_right"
# SPACE BAR: rotate a building Plan before placing it, and zoom to a Guard
# Tower that is sounding an alarm.
square = "key:Space"
# H: zoom to the Shaman. The most-used navigation key in the game - she is
# the unit everything is built around and the one the camera loses.
triangle = "key:H"
# The two click modifiers. Touch alone cannot hold a modifier while
# clicking, so without these a tablet player loses "select all Followers",
# multi-placed Plans, camera points, spell toggles (SHIFT) and multiple or
# forced commands and autocast (CTRL).
l1 = "key:LShift"
r1 = "key:LCtrl"
# MINUS/EQUALS: zoom out and in. The only camera control not on a stick.
l2 = "key:Minus"
r2 = "key:Equals"
# RETURN: World View, the whole-planet overview the level is navigated from.
select = "key:Return"
# ESC: the in-game menu.
start = "key:Escape"
# The native Options page. A physical controller has no F10 key and cannot
# reach the layout's own F10 button, so this is its way in.
ps = "action:settings"
# Not on the on-screen pad (the kit draws no L3/R3); these are for a
# physical controller. P pauses; ALT is the Keycard's third click modifier
# (autoselect for one command, zoom to a command group).
l3 = "key:P"
r3 = "key:LAlt"

[launcher]
# The launcher (kit host/launcher/): what it calls the game, the folder names
# and store ids it looks for, where to buy it, and the headroom an import
# leaves free.
title = "Populous: The Beginning"
install_names = ["Populous - The Beginning", "Populous The Beginning", "Populous"]
gog_ids = ["1207659027"]  # the goggame-1207659027.info in the supported install
# The GOG release is the one whose executable the pin matches.
store = "https://www.gog.com/game/populous_the_beginning"
# Steam sells the game too; its executable is not checked against the pin,
# so a Steam install is found and then reported if it differs.
steam_ids = ["2616430"]
min_free_mb = 800

[setup]
# tools/setup.py: what a supported installation must contain, and the
# annotation metadata imported into Ghidra before the listings are exported.
required_dirs = ["data", "levels", "objects", "sound"]
annotations_url = "https://github.com/hrttf111/pop3-rev.git"
annotations_revision = "60408e4e99b76ab2e5461897c8e1b33756360eaa"

[bundle]
# Left out of the iOS bundle: installers, GOG Galaxy, intro movies, Windows DLLs.
exclude = ["__redist", "commonappdata", "app", "Fmv", "*.dll", "*.cmd", "dxcfg.*"]
