name: Checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Contributor tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r kit/requirements-dev.txt
      - name: Portable tests (the kit's suites plus this game's config)
        run: |
          .venv/bin/python tools/test.py
          .venv/bin/python -m pytest -q tests
      - name: Install clang and lld (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld
      - name: Link-only configure of this game through the kit
        run: .venv/bin/python tools/build.py --stub
      - name: iOS stub compile (no signing)
        if: runner.os == 'macOS'
        run: .venv/bin/python tools/build.py --stub --target ios
